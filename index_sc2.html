<style>
:root{
  --ink:#15161a; --ink-2:#2a2c33; --muted:#777a83; --muted-2:#9a9da5;
  --bone:#f7f5f1; --paper:#ffffff; --line:#e6e2da; --line-2:#efece5;
  --clay:#c15430; --clay-dark:#a44425; --clay-soft:#f6e6df;
  --ok:#2f8f5b; --ok-soft:#e3f1e9;
  --info:#2c62d1; --info-soft:#e4ebfb;
  --warn:#b4821f; --warn-soft:#f7eed8;
  --violet:#6d52c4; --violet-soft:#ece7f9;
  --red:#b03a43; --red-soft:#f8e3e4;
  --grey-soft:#eceae6;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(20,22,26,.06), 0 8px 24px -12px rgba(20,22,26,.18);
  --sh-lg:0 24px 60px -20px rgba(20,22,26,.35);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans); background:var(--bone); color:var(--ink);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--clay);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6d1c8;border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:0 0 232px;background:var(--ink);color:#e9e6e0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{display:flex;align-items:center;gap:11px}
.brand-logo{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#fff;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar-logo{width:34px;height:34px;border-radius:9px;background:#fff;object-fit:cover;border:1px solid var(--line);display:none;flex:0 0 34px}
.brand-name{font-weight:650;letter-spacing:-.3px;font-size:15px}
.brand-sub{font-size:11.5px;color:rgba(255,255,255,.42);margin-top:3px;letter-spacing:.02em}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  color:rgba(255,255,255,.62);font-size:14px;font-weight:500;width:100%;text-align:left;transition:.15s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.nav-item .ic{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.nav-badge{margin-left:auto;background:var(--clay);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.side-foot{padding:14px 18px 18px;font-size:11.5px;color:rgba(255,255,255,.34);border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:rgba(255,255,255,.6);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(247,245,241,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;
}
.page-title{font-size:19px;font-weight:650;letter-spacing:-.4px;margin:0}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.search{position:relative;margin-left:auto;width:min(320px,38vw)}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);outline:none;transition:.15s;
}
.search input:focus{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.content{padding:24px 26px 90px;max-width:1400px;width:100%}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#cfc9bd;background:#fcfbf9}
.btn-primary{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn-primary:hover{background:var(--clay-dark);border-color:var(--clay-dark)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:#ece9e3;color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn-danger:hover{background:#f3d3d5;border-color:#f3d3d5}

/* ---------- Cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-head{padding:16px 18px 0;display:flex;align-items:center;gap:10px}
.card-title{font-size:14.5px;font-weight:650;letter-spacing:-.2px;margin:0}
.card-body{padding:16px 18px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.kpi-val{font-size:28px;font-weight:680;letter-spacing:-1px;margin-top:6px;line-height:1}
.kpi-note{font-size:12px;color:var(--muted);margin-top:5px}
.kpi-bar{position:absolute;left:0;top:0;bottom:0;width:3px}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--paper)}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:650;padding:11px 12px;border-bottom:1px solid var(--line);background:#fbfaf8;white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:#fbf9f6}
tbody tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tbody tr.today td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.cell-name{font-weight:620;letter-spacing:-.1px}
.cell-sub{font-size:12px;color:var(--muted);margin-top:1px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Pills & chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.s-da_chiamare{background:var(--grey-soft);color:#5e616a}
.pill.s-chiamato{background:var(--info-soft);color:var(--info)}
.pill.s-in_trattativa{background:var(--warn-soft);color:var(--warn)}
.pill.s-preventivo{background:var(--violet-soft);color:var(--violet)}
.pill.s-cliente{background:var(--ok-soft);color:var(--ok)}
.pill.s-perso{background:var(--red-soft);color:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--bone);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);margin:1px 3px 1px 0}
.zone-tag{background:var(--clay-soft);border-color:#ecd8ce;color:var(--clay-dark);font-weight:600}
.dot-yes{color:var(--ok);font-weight:700}
.dot-no{color:var(--muted-2)}

.filters-wrap{position:relative;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fcount{background:var(--clay);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:2px}
.filter-panel{
  position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:min(600px,100%);
  background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);
  padding:16px;display:none;
}
.filter-panel.open{display:block}
.ftag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 7px 5px 11px;border-radius:20px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:600;
}
.ftag b{font-weight:700}
.ftag button{color:rgba(255,255,255,.65);font-size:14px;line-height:1;padding:0 2px}
.ftag button:hover{color:#fff}
.chip{
  padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper);
  font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s;
}
.chip:hover{border-color:#cfc9bd;color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .cnt{opacity:.55;margin-left:4px;font-weight:600}
.sel{
  padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:13px;font-weight:550;outline:none;
}
.sel:focus{border-color:var(--clay)}

/* ---------- Forms ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:650;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--muted-2);font-weight:450}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);outline:none;transition:.15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.field textarea{resize:vertical;min-height:72px;line-height:1.55}
.switch{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;user-select:none}
.switch input{width:auto;accent-color:var(--clay);width:16px;height:16px;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.check{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
  border-radius:20px;background:var(--paper);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;
}
.check input{display:none}
.check.on{background:var(--clay-soft);border-color:#e7cec3;color:var(--clay-dark)}

/* ---------- Modal / Drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(21,22,26,.42);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.backdrop.show{opacity:1;pointer-events:auto}
.modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{
  width:min(760px,100%);max-height:calc(100dvh - 32px);margin:auto;background:var(--paper);
  border-radius:18px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;
  transform:translateY(8px) scale(.985);transition:transform .18s;
}
.modal.show .modal-box{transform:none}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.modal-head h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.3px}
.modal-body{padding:20px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;flex:1 1 auto;min-height:0}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#fcfbf9;border-radius:0 0 18px 18px;flex:0 0 auto}
body.locked{overflow:hidden}
.sec-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 0 -4px}

.drawer{
  position:fixed;z-index:100;top:0;right:0;height:100vh;width:min(480px,100vw);background:var(--paper);
  box-shadow:var(--sh-lg);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--line)}
.drawer-body{padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;background:#fcfbf9}
.info-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.info-row:last-child{border:none}
.info-k{flex:0 0 118px;color:var(--muted);font-size:12.5px;font-weight:600}
.info-v{flex:1;min-width:0;word-break:break-word}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tl-item:before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl-item:last-child:before{display:none}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--clay-soft);border:2px solid var(--clay);flex:0 0 11px;margin-top:4px}
.tl-body{flex:1;min-width:0}
.tl-date{font-size:11.5px;color:var(--muted);font-weight:600}
.tl-text{font-size:13.5px;margin-top:2px;white-space:pre-wrap}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.cal-month{font-size:17px;font-weight:650;letter-spacing:-.3px;text-transform:capitalize;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-dow{background:#fbfaf8;padding:9px 6px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cal-day{background:var(--paper);min-height:98px;padding:7px 7px 8px;display:flex;flex-direction:column;gap:4px;transition:.1s}
.cal-day.out{background:#fbfaf8;color:var(--muted-2)}
.cal-day.today{background:var(--clay-soft)}
.cal-num{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.cal-day.today .cal-num{color:var(--clay-dark)}
.cal-ev{
  font-size:11.5px;padding:3px 6px;border-radius:6px;background:var(--info-soft);color:var(--info);
  font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%;
}
.cal-ev.t-richiamo{background:var(--warn-soft);color:var(--warn)}
.cal-ev.t-appuntamento{background:var(--info-soft);color:var(--info)}
.cal-ev.t-consegna{background:var(--ok-soft);color:var(--ok)}
.cal-ev.t-scadenza{background:var(--red-soft);color:var(--red)}
.cal-ev.late{outline:1.5px solid var(--red);outline-offset:-1.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h4{font-size:15px;font-weight:650;color:var(--ink);margin:0 0 6px}
.agenda-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.agenda-item:last-child{border:none}
.agenda-when{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--grey-soft);color:#5e616a}
.agenda-when.late{background:var(--red-soft);color:var(--red)}
.agenda-when.now{background:var(--warn-soft);color:var(--warn)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-label{flex:0 0 120px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:var(--grey-soft);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:var(--clay);border-radius:20px;transition:.4s}
.bar-val{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650;font-size:12.5px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:550;z-index:200;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh-lg);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--warn)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:.12s}
.icon-btn:hover{background:var(--grey-soft);color:var(--ink)}
.hide{display:none !important}

@media (max-width:900px){
  .app{flex-direction:column}
  .sidebar{
    position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex:none;z-index:50;
    flex-direction:row;border-top:1px solid rgba(255,255,255,.1);
  }
  .brand,.side-foot{display:none}
  .topbar-logo{display:block}
  .nav{flex-direction:row;padding:6px;gap:2px;justify-content:space-around}
  .nav-item{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 6px;text-align:center}
  .nav-item .lbl{font-size:10.5px}
  .nav-badge{position:absolute;top:2px;right:50%;margin-right:-22px;font-size:9.5px;padding:0 5px}
  .nav-item{position:relative}
  .content{padding:16px 14px 110px}
  .topbar{padding:12px 14px;flex-wrap:wrap}
  .search{width:100%;margin-left:0;order:3}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .cal-head #btnNewEv{width:100%;justify-content:center;order:3}
  .cal-month{font-size:15px}
  .filter-panel{width:100%}
  .cal-day{min-height:62px;padding:4px}
  .cal-ev{font-size:10px;padding:2px 4px}
  .modal{padding:8px}
  .modal-box{max-height:calc(100dvh - 16px)}
  .drawer{width:100vw;height:100dvh}
  .info-k{flex:0 0 96px}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="brand-logo" id="brandLogo" alt="SC Workwear">
        <div>
          <div class="brand-name">SC Workwear</div>
          <div class="brand-sub">Gestionale clienti</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="lbl">Dashboard</span>
      </button>
      <button class="nav-item" data-view="clienti">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span class="lbl">Clienti</span>
        <span class="nav-badge hide" id="badgeClienti">0</span>
      </button>
      <button class="nav-item" data-view="chiamate">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <span class="lbl">Da chiamare</span>
        <span class="nav-badge hide" id="badgeCall">0</span>
      </button>
      <button class="nav-item" data-view="calendario">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="lbl">Calendario</span>
      </button>
      <button class="nav-item" data-view="dati">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
        <span class="lbl">Dati</span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="sync" id="syncState"><i></i><span>Caricamento…</span></div>
      <div style="margin-top:6px">Clienti: <b id="footCount">0</b></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <img class="topbar-logo" id="topbarLogo" alt="SC Workwear">
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="page-sub" id="pageSub">Panoramica attività</div>
      </div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="globalSearch" type="search" placeholder="Cerca nome, telefono, zona, fornitura…">
      </div>
      <button class="btn btn-primary" id="btnNew">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuovo cliente
      </button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- MODAL CLIENTE -->
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modalCliente">
 <div class="modal-box">
  <div class="modal-head">
    <h3 id="modalTitle">Nuovo cliente</h3>
    <button class="icon-btn" style="margin-left:auto" data-close>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <form class="modal-body" id="formCliente">
    <div class="sec-title">Anagrafica</div>
    <div class="grid-2">
      <div class="field">
        <label>Nome cliente *</label>
        <input name="nome" required placeholder="Mario Rossi">
      </div>
      <div class="field">
        <label>Azienda / Ragione sociale</label>
        <input name="azienda" placeholder="Rossi Srl — Palestra, Bar, Team…">
      </div>
      <div class="field">
        <label>Numero di telefono</label>
        <input name="telefono" type="tel" placeholder="+39 333 1234567">
      </div>
      <div class="field">
        <label>E-mail</label>
        <input name="email" type="email" placeholder="info@esempio.it">
      </div>
      <div class="field">
        <label>Indirizzo</label>
        <input name="indirizzo" placeholder="Via Roma 12, Milano">
      </div>
      <div class="field">
        <label>Zona</label>
        <input name="zona" list="zoneList" placeholder="Nord Milano, Brianza…">
        <datalist id="zoneList"></datalist>
      </div>
    </div>

    <div class="sec-title">Contatto</div>
    <div class="grid-3">
      <div class="field">
        <label>Stato trattativa</label>
        <select name="stato">
          <option value="da_chiamare">Da chiamare</option>
          <option value="chiamato">Chiamato</option>
          <option value="in_trattativa">In trattativa</option>
          <option value="preventivo">Preventivo inviato</option>
          <option value="cliente">Cliente acquisito</option>
          <option value="perso">Non interessato</option>
        </select>
      </div>
      <div class="field">
        <label>Data contatto</label>
        <input name="data" type="date">
      </div>
      <div class="field">
        <label>Prossimo richiamo</label>
        <input name="prossimoRichiamo" type="date">
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" name="chiamato">
      <span><b>Chiamato</b> — spunta quando il cliente è stato contattato</span>
    </label>

    <div class="sec-title">Fornitura</div>
    <div class="field">
      <label>Di cosa ha bisogno <span class="hint">capi, taglie, uso</span></label>
      <textarea name="fornitura" placeholder="30 polo nere con logo ricamato sul petto, taglie miste S–XXL, per staff sala"></textarea>
    </div>
    <div class="field">
      <label>Tipo di personalizzazione</label>
      <div class="checks" id="persoChecks"></div>
    </div>
    <div class="grid-3">
      <div class="field">
        <label>Quantità pezzi</label>
        <input name="quantita" type="number" min="0" step="1" placeholder="30">
      </div>
      <div class="field">
        <label>Valore stimato (€)</label>
        <input name="valore" type="number" min="0" step="1" placeholder="750">
      </div>
      <div class="field">
        <label>Fonte contatto</label>
        <input name="fonte" list="fontiList" placeholder="Passaparola, Instagram…">
        <datalist id="fontiList">
          <option value="Porta a porta"><option value="Passaparola"><option value="Instagram">
          <option value="Sito web"><option value="Fiera"><option value="Telefonata a freddo"><option value="Cliente esistente">
        </datalist>
      </div>
    </div>

    <div class="sec-title">Commenti</div>
    <div class="field">
      <label>Commenti <span class="hint">note sulla chiamata, obiezioni, accordi presi</span></label>
      <textarea name="commenti" placeholder="Interessato ma vuole vedere i campioni. Richiamare dopo il 20."></textarea>
    </div>
  </form>

/* ---------- Persistenza (db capability + fallback locale) ---------- */
const Store = {
  db: null, mode: 'local', ready: false,
  LS_C: 'gest_clienti_v1', LS_E: 'gest_eventi_v1',

  async init(){
    let done = false;
    const timer = setTimeout(() => { if(!done){ this.loadLocal(); this.setBadge('local','Salvataggio locale'); boot(); } }, 9000);
    try {
      const db = (window.claude && claude.use) ? await claude.use('db') : null;
      if (db) {
        this.db = db; this.mode = 'db';
        try {
          await this.pullAll();
          this.subscribe();
          this.setBadge('db','Sincronizzato');
        } catch(e){ console.warn(e); this.mode='local'; this.loadLocal(); this.setBadge('local','Salvataggio locale'); }
      } else { this.loadLocal(); this.setBadge('local','Salvataggio locale'); }
    } catch(e){ console.warn(e); this.loadLocal(); this.setBadge('local','Salvataggio locale'); }
    done = true; clearTimeout(timer);
    this.ready = true;
    boot();
  },

  setBadge(mode, text){
    const el = document.getElementById('syncState');
    if(!el) return;
    el.className = 'sync' + (mode==='local' ? ' local' : '');
    el.querySelector('span').textContent = text;
  },

  norm(snap){
    if(!snap) return [];
    let arr = Array.isArray(snap) ? snap : (snap.docs || snap.items || snap.data || []);
    if(!Array.isArray(arr)) return [];
    return arr.map(d => {
      if(!d) return null;
      if(typeof d.data === 'function'){ const v = d.data() || {}; return {...v, id: v.id || d.id}; }
      if(d.data && typeof d.data === 'object'){ return {...d.data, id: d.data.id || d.id}; }
      return d;
    }).filter(Boolean);
  },

  async pullAll(){
    const [c,e] = await Promise.all([
      this.db.collection('clients').get(),
      this.db.collection('events').get()
    ]);
    State.clients = this.norm(c);
    State.events  = this.norm(e);
  },

  subscribe(){
    try {
      this.db.collection('clients').onSnapshot(s => { State.clients = this.norm(s); if(State.ready!==false) render(); });
      this.db.collection('events').onSnapshot(s => { State.events  = this.norm(s); if(State.ready!==false) render(); });
    } catch(e){ console.warn('snapshot non disponibile', e); }
  },

  loadLocal(){
    try { State.clients = JSON.parse(localStorage.getItem(this.LS_C) || '[]'); } catch(e){ State.clients = []; }
    try { State.events  = JSON.parse(localStorage.getItem(this.LS_E) || '[]'); } catch(e){ State.events  = []; }
  },
  saveLocal(){
    try {
      localStorage.setItem(this.LS_C, JSON.stringify(State.clients));
      localStorage.setItem(this.LS_E, JSON.stringify(State.events));
    } catch(e){ console.warn('localStorage non disponibile'); }
  },

  async put(coll, obj){
    const list = coll === 'clients' ? State.clients : State.events;
    const i = list.findIndex(x => x.id === obj.id);
    if (i >= 0) list[i] = obj; else list.push(obj);
    this.saveLocal();
    if (this.mode === 'db') {
      try { await this.db.doc(coll + '/' + obj.id).set(obj); }
      catch(e){ console.warn(e); toast('Salvato solo in locale (sincronizzazione non riuscita)'); }
    }
  },

  async remove(coll, id){
    const list = coll === 'clients' ? State.clients : State.events;
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) list.splice(i,1);
    this.saveLocal();
    if (this.mode === 'db') {
      try { await this.db.doc(coll + '/' + id).delete(); } catch(e){ console.warn(e); }
    }
  },
};

/* ---------- Utility ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const iso = d => d.toLocaleDateString('sv-SE');
const fmtDate = s => { if(!s) return '—'; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtEur = n => (Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const telHref = t => 'tel:' + String(t||'').replace(/[^\d+]/g,'');
const waHref  = t => { let n = String(t||'').replace(/[^\d]/g,''); if(n.length===10 && n.startsWith('3')) n = '39'+n; return 'https://wa.me/' + n; };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- Derivazioni ---------- */
function zones(){ return [...new Set(State.clients.map(c => (c.zona||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')); }

function matchSearch(c, q){
  if(!q) return true;
  const hay = [c.nome,c.azienda,c.telefono,c.email,c.indirizzo,c.zona,c.fornitura,c.commenti,c.fonte,(c.personalizzazioni||[]).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function filtered(){
  let r = State.clients.filter(c => matchSearch(c, State.search));
  if (State.filterStato !== 'all') r = r.filter(c => (c.stato||'da_chiamare') === State.filterStato);
  if (State.filterZona  !== 'all') r = r.filter(c => (c.zona||'') === State.filterZona);
  if (State.filterChiamato === 'si') r = r.filter(c => !!c.chiamato);
  if (State.filterChiamato === 'no') r = r.filter(c => !c.chiamato);
  const k = State.sortKey, dir = State.sortDir === 'asc' ? 1 : -1;
  r.sort((a,b) => {
    let va = a[k] ?? '', vb = b[k] ?? '';
    if (k === 'valore' || k === 'quantita'){ va = Number(va)||0; vb = Number(vb)||0; return (va-vb)*dir; }
    return String(va).localeCompare(String(vb),'it',{numeric:true}) * dir;
  });
  return r;
}

function richiami(){
  const t = todayISO();
  return State.clients
    .filter(c => c.prossimoRichiamo && !['cliente','perso'].includes(c.stato))
    .map(c => ({...c, _d: daysBetween(t, c.prossimoRichiamo)}))
    .sort((a,b) => a._d - b._d);
}

function calItems(){
  const out = [];
  State.clients.forEach(c => {
    if (c.prossimoRichiamo && !['perso'].includes(c.stato))
      out.push({date:c.prossimoRichiamo, tipo:'richiamo', titolo:'Richiama ' + (c.nome||''), clienteId:c.id, kind:'client'});
  });
  State.events.forEach(e => out.push({...e, kind:'event'}));
  return out;
}

  dl.innerHTML = zones().map(z => `<option value="${esc(z)}">`).join('');

  const c = document.getElementById('content');
  if (State.view === 'dashboard')  c.innerHTML = viewDashboard();
  if (State.view === 'clienti')    c.innerHTML = viewClienti();
  if (State.view === 'chiamate')   c.innerHTML = viewChiamate();
  if (State.view === 'calendario') c.innerHTML = viewCalendario();
  if (State.view === 'dati')       c.innerHTML = viewDati();
  wire();
}

/* ---------- Dashboard ---------- */
function viewDashboard(){
  const cs = State.clients, t = todayISO();
  const by = s => cs.filter(c => (c.stato||'da_chiamare') === s).length;
  const daChiamare = cs.filter(c => !c.chiamato && c.stato !== 'perso').length;
  const pipeline = cs.filter(c => !['perso','cliente'].includes(c.stato)).reduce((s,c)=>s+(Number(c.valore)||0),0);
  const chiuso = cs.filter(c => c.stato === 'cliente').reduce((s,c)=>s+(Number(c.valore)||0),0);
  const contattati = cs.filter(c => c.chiamato).length;
  const conv = contattati ? Math.round(by('cliente')/contattati*100) : 0;
  const rs = richiami();
  const scaduti = rs.filter(r => r._d < 0);
  const oggi = rs.filter(r => r._d === 0);
  const settimana = rs.filter(r => r._d > 0 && r._d <= 7);

  if (!cs.length) return emptyState();

  const zoneStats = zones().map(z => {
    const list = cs.filter(c => c.zona === z);
    return {z, n:list.length, val:list.reduce((s,c)=>s+(Number(c.valore)||0),0)};
  }).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxZ = Math.max(1, ...zoneStats.map(x=>x.n));

  const agenda = [...scaduti, ...oggi, ...settimana].slice(0,8);

  return `
  <div class="kpis">
    ${kpi('Clienti totali', cs.length, `${contattati} già contattati`, 'var(--ink)')}
    ${kpi('Da chiamare', daChiamare, daChiamare ? 'in attesa di primo contatto' : 'tutto contattato ✓', 'var(--clay)')}
    ${kpi('Richiami oggi', oggi.length + scaduti.length, scaduti.length ? `${scaduti.length} in ritardo` : 'nessun arretrato', scaduti.length ? 'var(--red)' : 'var(--warn)')}
    ${kpi('Pipeline aperta', fmtEur(pipeline), `${cs.filter(c=>!['perso','cliente'].includes(c.stato)).length} trattative`, 'var(--violet)')}
    ${kpi('Venduto', fmtEur(chiuso), `${by('cliente')} clienti acquisiti`, 'var(--ok)')}
    ${kpi('Conversione', conv + '%', 'su clienti contattati', 'var(--info)')}
  </div>

  <div style="display:grid;grid-template-columns:1.25fr .85fr;gap:16px" class="dash-grid">
    <div class="card">
      <div class="card-head">
        <h3 class="card-title">Agenda richiami</h3>
        <button class="btn btn-sm btn-ghost" data-goto="chiamate" style="margin-left:auto">Vedi tutti →</button>
      </div>
      <div class="card-body" style="padding-top:8px">
        ${agenda.length ? agenda.map(r => {
          const cls = r._d < 0 ? 'late' : (r._d === 0 ? 'now' : '');
          const lab = r._d < 0 ? `${-r._d}g fa` : (r._d === 0 ? 'oggi' : `tra ${r._d}g`);
          return `<div class="agenda-item">
            <span class="agenda-when ${cls}">${lab}</span>
            <div style="flex:1;min-width:0">
              <div class="cell-name">${esc(r.nome)}</div>
              <div class="cell-sub">${esc(r.zona||'—')} · ${esc((r.fornitura||'').slice(0,60) || 'nessuna nota fornitura')}</div>
            </div>
            <div class="row-actions">
              ${r.telefono ? `<a class="icon-btn" href="${telHref(r.telefono)}" title="Chiama">📞</a>` : ''}
              <button class="icon-btn" data-open="${r.id}" title="Apri">→</button>
            </div>
          </div>`;
        }).join('') : `<div class="empty" style="padding:26px"><h4>Nessun richiamo in programma</h4><div>Imposta una data di prossimo richiamo nelle schede cliente.</div></div>`}
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-head"><h3 class="card-title">Pipeline per stato</h3></div>
        <div class="card-body" style="padding-top:12px">
          ${Object.entries(STATI).map(([k,v]) => {
            const n = by(k), pct = cs.length ? n/cs.length*100 : 0;
            return `<div class="bar-row">
              <span class="bar-label" style="color:${v.color}">${v.label}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${v.color}"></span></span>
              <span class="bar-val">${n}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3 class="card-title">Zone principali</h3></div>
        <div class="card-body" style="padding-top:12px">
          ${zoneStats.length ? zoneStats.map(z => `
            <div class="bar-row">
              <span class="bar-label">${esc(z.z)}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${z.n/maxZ*100}%"></span></span>
              <span class="bar-val">${z.n}</span>
            </div>`).join('') : '<div style="color:var(--muted);font-size:13px">Nessuna zona inserita.</div>'}
        </div>
      </div>
    </div>
  </div>
  <style>@media(max-width:900px){.dash-grid{grid-template-columns:1fr !important}}</style>`;
}

function kpi(label, val, note, color){
  return `<div class="kpi"><span class="kpi-bar" style="background:${color}"></span>
    <div class="kpi-label">${label}</div>
    <div class="kpi-val num">${val}</div>
    <div class="kpi-note">${note}</div></div>`;
}

  return `<tr class="${cls}" data-row="${c.id}">

/* ---------- Calendario ---------- */
function viewCalendario(){
  const ref = State.calRef;
  const y = ref.getFullYear(), m = ref.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - startDow);
  const items = calItems();
  const t = todayISO();

  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = iso(d);
    const out = d.getMonth() !== m;
    const dayItems = items.filter(x => x.date === ds);
    cells += `<div class="cal-day ${out?'out':''} ${ds===t?'today':''}" data-day="${ds}">
      <div class="cal-num">${d.getDate()}</div>
      ${dayItems.slice(0,3).map(x => `<button class="cal-ev t-${x.tipo||'appuntamento'} ${x.date<t && x.tipo==='richiamo' ? 'late':''}"
          data-${x.kind==='client'?'open':'ev'}="${x.kind==='client'?x.clienteId:x.id}">${x.ora?esc(x.ora)+' ':''}${esc(x.titolo||'')}</button>`).join('')}
      ${dayItems.length>3 ? `<div style="font-size:10.5px;color:var(--muted);font-weight:600">+${dayItems.length-3} altri</div>` : ''}
    </div>`;
  }

  const mese = MESI[m];
  return `
  <div class="cal-head">
    <div class="cal-nav">
      <button class="btn btn-sm" id="calPrev" title="Mese precedente">‹</button>
      <button class="btn btn-sm" id="calNext" title="Mese successivo">›</button>
      <div class="cal-month">${mese} ${y}</div>
      <button class="btn btn-sm btn-ghost" id="calToday">Oggi</button>
    </div>
    <button class="btn btn-sm btn-primary" id="btnNewEv">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Appuntamento
    </button>
  </div>
  <div class="cal-grid">
    ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
    ${cells}
  </div>
  <div class="legend">
    <span><i style="background:#f7eed8"></i>Richiamo cliente</span>
    <span><i style="background:#e4ebfb"></i>Appuntamento</span>
    <span><i style="background:#e3f1e9"></i>Consegna</span>
    <span><i style="background:#f8e3e4"></i>Scadenza</span>
    <span style="margin-left:auto">Clicca una voce per aprirla, un giorno vuoto per creare un appuntamento</span>
  </div>`;
}

/* =========================================================
   INTERAZIONI
   ========================================================= */
const $ = s => document.querySelector(s);
const backdrop = $('#backdrop');

let _scrollY = 0;
function lockScroll(){
  if (document.body.classList.contains('locked')) return;
  _scrollY = window.scrollY || window.pageYOffset || 0;
  document.body.classList.add('locked');
  document.body.style.position = 'fixed';
  document.body.style.top = -_scrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockScroll(){
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, _scrollY);
}
function openModal(el){ lockScroll(); backdrop.classList.add('show'); el.classList.add('show'); }
function closeAll(){
  backdrop.classList.remove('show');
  $('#modalCliente').classList.remove('show');
  $('#modalEvento').classList.remove('show');
  $('#drawer').classList.remove('show');
  unlockScroll();
}
backdrop.addEventListener('click', closeAll);
// click sullo sfondo del modale (fuori dal riquadro) = chiudi
document.querySelectorAll('.modal').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) closeAll(); }));
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ---------- Form cliente ---------- */
function renderPersoChecks(selected = []){
  $('#persoChecks').innerHTML = PERSONALIZZAZIONI.map(p => `
    <label class="check ${selected.includes(p)?'on':''}">
      <input type="checkbox" value="${p}" ${selected.includes(p)?'checked':''}>${p}
    </label>`).join('');
  $('#persoChecks').querySelectorAll('input').forEach(i => {
    i.addEventListener('change', () => i.closest('.check').classList.toggle('on', i.checked));
  });
}

function openCliente(id){
  const f = $('#formCliente');
  f.reset();
  State.editingId = id || null;
  const c = id ? State.clients.find(x => x.id === id) : null;
  $('#modalTitle').textContent = c ? 'Modifica cliente' : 'Nuovo cliente';

async function saveCliente(){
  const f = $('#formCliente');
  if (!f.reportValidity()) return;
  const prev = State.editingId ? State.clients.find(x => x.id === State.editingId) : null;
  const perso = [...$('#persoChecks').querySelectorAll('input:checked')].map(i => i.value);
  const obj = {
    id: State.editingId || uid(),
    nome: f.nome.value.trim(),
    azienda: f.azienda.value.trim(),
    telefono: f.telefono.value.trim(),
    email: f.email.value.trim(),
    indirizzo: f.indirizzo.value.trim(),
    zona: f.zona.value.trim(),
    stato: f.stato.value,
    chiamato: f.chiamato.checked,
    data: f.data.value,
    prossimoRichiamo: f.prossimoRichiamo.value,
    fornitura: f.fornitura.value.trim(),
    personalizzazioni: perso,
    quantita: f.quantita.value ? Number(f.quantita.value) : '',
    valore: f.valore.value ? Number(f.valore.value) : '',
    fonte: f.fonte.value.trim(),
    commenti: f.commenti.value.trim(),
    storico: prev?.storico || [],
    createdAt: prev?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  // storico automatico
  if (prev) {
    if (prev.stato !== obj.stato) obj.storico = [{t:new Date().toISOString(), testo:`Stato: ${STATI[prev.stato]?.label||prev.stato} → ${STATI[obj.stato]?.label||obj.stato}`}, ...obj.storico];
    if (!prev.chiamato && obj.chiamato) obj.storico = [{t:new Date().toISOString(), testo:'Segnato come chiamato'}, ...obj.storico];
    if (prev.commenti !== obj.commenti && obj.commenti) obj.storico = [{t:new Date().toISOString(), testo:'Commento: ' + obj.commenti}, ...obj.storico];
  } else {
    obj.storico = [{t:new Date().toISOString(), testo:'Cliente inserito in anagrafica'}];
  }
  await Store.put('clients', obj);
  closeAll(); render();
  toast(prev ? 'Cliente aggiornato' : 'Cliente salvato');
}

/* ---------- Import / Export ---------- */
const CSV_COLS = ['nome','azienda','telefono','email','indirizzo','zona','chiamato','stato','fornitura','personalizzazioni','quantita','valore','fonte','data','prossimoRichiamo','commenti'];

async function download(name, text, type){
  try {
    const dl = (window.claude && claude.use) ? await claude.use('downloads') : null;
    if (dl) { await dl.save({filename:name, data:text}); return; }
  } catch(e){ console.warn(e); toast('Download annullato'); return; }
  try {
    const blob = new Blob([text], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  } catch(e){ toast('Download non disponibile su questo dispositivo'); }
}
async function exportCsv(){
  const esc2 = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [CSV_COLS.join(';')].concat(State.clients.map(c => CSV_COLS.map(k => {
    let v = c[k];
    if (k === 'chiamato') v = c.chiamato ? 'sì' : 'no';
    if (k === 'stato') v = STATI[c.stato]?.label || c.stato;
    if (k === 'personalizzazioni') v = (c.personalizzazioni||[]).join(', ');
    return esc2(v);
  }).join(';')));
  await download(`clienti_${todayISO()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('CSV esportato');
}
async function exportJson(){
  await download(`backup_gestionale_${todayISO()}.json`, JSON.stringify({clients:State.clients, events:State.events, v:1}, null, 2), 'application/json');
  toast('Backup scaricato');
}
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ';' || ch === ','){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
async function importCsv(file){
  const rows = parseCsv(await file.text());
  if (rows.length < 2) return toast('CSV vuoto');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const statoFromLabel = l => Object.entries(STATI).find(([k,v]) => v.label.toLowerCase() === String(l).trim().toLowerCase())?.[0];
  let n = 0;
  for (const r of rows.slice(1)) {
    const g = k => { const i = head.indexOf(k); return i >= 0 ? String(r[i] ?? '').trim() : ''; };
    const nome = g('nome') || g('cliente') || g('nome cliente');
    if (!nome) continue;
    const ch = g('chiamato').toLowerCase();
    const o = {
      id: uid(), nome,
      azienda:g('azienda'), telefono:g('telefono')||g('numero'), email:g('email')||g('e-mail'),
      indirizzo:g('indirizzo'), zona:g('zona'),
      chiamato: ['si','sì','yes','x','true','1','vero'].includes(ch),
      stato: statoFromLabel(g('stato')) || (STATI[g('stato')] ? g('stato') : (['si','sì','yes','x','true','1','vero'].includes(ch) ? 'chiamato' : 'da_chiamare')),
      fornitura:g('fornitura'), personalizzazioni: g('personalizzazioni') ? g('personalizzazioni').split(/[,;|]/).map(s=>s.trim()).filter(Boolean) : [],
      quantita: g('quantita') ? Number(g('quantita').replace(/[^\d]/g,'')) : '',
      valore: g('valore') ? Number(g('valore').replace(/[^\d,.]/g,'').replace(',','.')) : '',
      fonte:g('fonte'), data:g('data'), prossimoRichiamo:g('prossimorichiamo')||g('prossimo richiamo'),
      commenti:g('commenti')||g('note'),
      storico:[{t:new Date().toISOString(), testo:'Importato da CSV'}],
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    };
    await Store.put('clients', o); n++;
  }
  render(); toast(`${n} clienti importati`);
}
async function importJson(file){
  try {
    const d = JSON.parse(await file.text());
    const cs = d.clients || d;
    if (!Array.isArray(cs)) return toast('File non valido');
    for (const c of cs) { c.id = c.id || uid(); await Store.put('clients', c); }
    for (const e of (d.events || [])) { e.id = e.id || uid(); await Store.put('events', e); }
    render(); toast('Backup ripristinato');
  } catch(e){ toast('File non leggibile'); }
}

function wire(){
  const c = document.getElementById('content');

  const bf = c.querySelector('#btnFiltri');
  if (bf) bf.onclick = e => { e.stopPropagation(); State.panelOpen = !State.panelOpen; render(); };
  const cp = c.querySelector('#closePanel');
  if (cp) cp.onclick = () => { State.panelOpen = false; render(); };
  const fs = c.querySelector('#fStato');     if (fs) fs.onchange = () => { State.filterStato = fs.value; render(); };
  const fz = c.querySelector('#fZona');      if (fz) fz.onchange = () => { State.filterZona = fz.value; render(); };
  const fc = c.querySelector('#fChiamato');  if (fc) fc.onchange = () => { State.filterChiamato = fc.value; render(); };
  c.querySelectorAll('[data-clear]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const k = b.dataset.clear;
    if (k === 'all'){ State.filterStato = 'all'; State.filterZona = 'all'; State.filterChiamato = 'all'; }
    if (k === 'stato')    State.filterStato = 'all';
    if (k === 'zona')     State.filterZona = 'all';
    if (k === 'chiamato') State.filterChiamato = 'all';
    render();
  });
  c.querySelectorAll('[data-stato]').forEach(b => b.onclick = () => { State.filterStato = b.dataset.stato; render(); });
  c.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (State.sortKey === k) State.sortDir = State.sortDir === 'asc' ? 'desc' : 'asc';
    else { State.sortKey = k; State.sortDir = 'asc'; }
    render();
  });

  c.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.stopPropagation(); openDrawer(b.dataset.open); });
  c.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); openCliente(b.dataset.edit); });

    openDrawer(tr.dataset.row);

  // calendario
  const prev = c.querySelector('#calPrev'), next = c.querySelector('#calNext'), tod = c.querySelector('#calToday');
  if (prev) prev.onclick = () => { State.calRef = new Date(State.calRef.getFullYear(), State.calRef.getMonth()-1, 1); render(); };
  if (next) next.onclick = () => { State.calRef = new Date(State.calRef.getFullYear(), State.calRef.getMonth()+1, 1); render(); };

  });

  // dati
  const q = (s, fn) => { const el = c.querySelector(s); if (el) fn(el); };
  q('#expCsv',  el => el.onclick = exportCsv);
  q('#expJson', el => el.onclick = exportJson);
  q('#impCsv',  el => el.onchange = ev => ev.target.files[0] && importCsv(ev.target.files[0]));
  q('#impJson', el => el.onchange = ev => ev.target.files[0] && importJson(ev.target.files[0]));
  q('#wipe',    el => el.onclick = async () => {
    if (!confirm('Eliminare TUTTI i clienti e gli appuntamenti? Operazione non reversibile.')) return;
    for (const x of [...State.clients]) await Store.remove('clients', x.id);
    for (const x of [...State.events])  await Store.remove('events', x.id);
    render(); toast('Archivio svuotato');
  });

  // richiami dal drawer
  document.querySelectorAll('[data-remind]').forEach(b => b.onclick = () => {
    const [id, d] = b.dataset.remind.split('|'); setRemind(id, Number(d));
  });
}

/* ---------- Globali ---------- */
$('#btnNew').onclick = () => openCliente();
$('#btnSave').onclick = saveCliente;
$('#formCliente').addEventListener('submit', e => { e.preventDefault(); saveCliente(); });
$('#btnSaveEv').onclick = saveEvento;
$('#formEvento').addEventListener('submit', e => { e.preventDefault(); saveEvento(); });
$('#btnDelete').onclick = async () => {
  if (!State.editingId) return;
  const c = State.clients.find(x => x.id === State.editingId);
  if (!confirm(`Eliminare "${c?.nome || 'questo cliente'}"?`)) return;
  await Store.remove('clients', State.editingId);
  closeAll(); render(); toast('Cliente eliminato');
};
$('#btnDeleteEv').onclick = async () => {
  if (!State.editingEvId) return;
  if (!confirm('Eliminare questo appuntamento?')) return;
  await Store.remove('events', State.editingEvId);
  closeAll(); render(); toast('Appuntamento eliminato');
};
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('.nav-item'); if (!b) return;
  State.view = b.dataset.view; render();
});
// chiude il pannello filtri cliccando fuori (senza ridisegnare, per non perdere il click)
document.addEventListener('mousedown', e => {
  if (!State.panelOpen) return;
  if (e.target.closest('.filters-wrap')) return;
  State.panelOpen = false;
  const p = document.getElementById('filterPanel');
  if (p) p.classList.remove('open');
});

let searchTimer;
$('#globalSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    State.search = e.target.value;
    if (State.search && State.view !== 'clienti') State.view = 'clienti';
    render();
  }, 160);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $('#globalSearch').focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#globalSearch').focus(); }
});

let booted = false;
function boot(){ if (booted) return; booted = true; render(); }
render();
Store.init();
</script>
</body>
</html>
